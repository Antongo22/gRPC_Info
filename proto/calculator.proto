syntax = "proto3";

package calculator;

// Сервис для выполнения математических операций
service Calculator {
  // Метод для сложения двух чисел
  rpc Add (AddRequest) returns (AddResponse);
}

// Запрос на сложение
message AddRequest {
  double number1 = 1;
  double number2 = 2;
}

// Ответ со результатом сложения
message AddResponse {
  double result = 1;
}
